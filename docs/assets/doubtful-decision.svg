<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">How a doubtful item is decided</title>
<desc id="d">A doubtful item is blurred or left visible according to the unsure option. With placed, the default, it is blurred only if it is placed like a plate or a face. With blur it is blurred. With keep it stays visible. A person's decision in Review replaces the engine's.</desc>
<rect width="760" height="340" rx="10" fill="#f6f7f9" stroke="#c9ced6"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#46505e"/></marker></defs>
<g font-size="14" fill="#1d2430">
<rect x="20" y="130" width="140" height="64" rx="8" fill="#fdf3dc" stroke="#b7791f"/>
<text x="90" y="157" text-anchor="middle" font-weight="600">Doubtful item</text>
<text x="90" y="177" text-anchor="middle" font-size="12" fill="#46505e">verdict check</text>

<rect x="215" y="130" width="140" height="64" rx="8" fill="#ffffff" stroke="#46505e"/>
<text x="285" y="157" text-anchor="middle" font-weight="600">Options.unsure</text>
<text x="285" y="177" text-anchor="middle" font-size="12" fill="#46505e">placed, blur or keep</text>

<rect x="410" y="25" width="170" height="64" rx="8" fill="#ffffff" stroke="#46505e"/>
<text x="495" y="52" text-anchor="middle" font-weight="600">placed (default)</text>
<text x="495" y="72" text-anchor="middle" font-size="11" fill="#46505e">placed like a plate or face?</text>

<rect x="420" y="138" width="150" height="48" rx="8" fill="#ffffff" stroke="#46505e"/>
<text x="495" y="168" text-anchor="middle" font-weight="600">blur (2.1 settings)</text>
<rect x="420" y="235" width="150" height="48" rx="8" fill="#ffffff" stroke="#46505e"/>
<text x="495" y="265" text-anchor="middle" font-weight="600">keep (v1 settings)</text>

<rect x="620" y="20" width="120" height="34" rx="8" fill="#e6f4ea" stroke="#2e7d4f"/>
<text x="680" y="42" text-anchor="middle" font-size="13">yes: blurred</text>
<rect x="620" y="62" width="120" height="34" rx="8" fill="#fbe9e7" stroke="#b5483a"/>
<text x="680" y="84" text-anchor="middle" font-size="13">no: left visible</text>
<rect x="620" y="144" width="120" height="34" rx="8" fill="#e6f4ea" stroke="#2e7d4f"/>
<text x="680" y="166" text-anchor="middle" font-size="13">blurred</text>
<rect x="620" y="241" width="120" height="34" rx="8" fill="#fbe9e7" stroke="#b5483a"/>
<text x="680" y="263" text-anchor="middle" font-size="13">left visible</text>
</g>
<g stroke="#46505e" stroke-width="1.6" fill="none" marker-end="url(#a)">
<path d="M160 162H213"/><path d="M355 150L408 78"/><path d="M355 162H418"/><path d="M355 175L418 255"/>
<path d="M580 50L618 40"/><path d="M580 66L618 78"/><path d="M570 162H618"/><path d="M570 259H618"/>
</g>
<text x="380" y="316" text-anchor="middle" font-size="13" fill="#1d2430">A person's decision in Review replaces whatever the engine chose. The report records who decided.</text>
</svg>
